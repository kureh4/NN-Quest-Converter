name: Publish v1.0.0 package and source

on:
  push:
    paths:
      - 'dist_parts/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild UnityPackage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist .extract
          cat dist_parts/part*.b64 | tr -d '\n\r' | base64 -d > dist/nekoneko_quest_converter_v1.0.0.unitypackage
          tar -xzf dist/nekoneko_quest_converter_v1.0.0.unitypackage -C .extract

      - name: Extract Unity source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.extract')
          old_prefix = 'Assets/nekoneko/QuestConverter'
          new_prefix = 'Assets/nekoneko/NN - Quest Converter'

          for entry in root.iterdir():
              if not entry.is_dir():
                  continue
              pathname = entry / 'pathname'
              if not pathname.exists():
                  continue
              path = pathname.read_text(encoding='utf-8').strip()
              if path.startswith(old_prefix):
                  path = new_prefix + path[len(old_prefix):]

              target = Path(path)
              asset = entry / 'asset'
              meta = entry / 'asset.meta'

              if asset.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(asset, target)

              if meta.exists():
                  meta_target = Path(str(target) + '.meta')
                  meta_target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(meta, meta_target)
          PY

      - name: Verify package and source
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/nekoneko_quest_converter_v1.0.0.unitypackage
          test -s 'Assets/nekoneko/NN - Quest Converter/Editor/NekoQuestAnalyzer.cs'
          test -s 'Assets/nekoneko/NN - Quest Converter/Editor/NekoQuestConverterWindow.cs'
          test -s 'Assets/nekoneko/NN - Quest Converter/Editor/NekoQuestData.cs'
          test -s 'Assets/nekoneko/NN - Quest Converter/Editor/NekoQuestGenerator.cs'
          test -s 'Assets/nekoneko/NN - Quest Converter/Editor/NekoQuestSdkBridge.cs'
          sha256sum dist/nekoneko_quest_converter_v1.0.0.unitypackage

      - name: Commit published files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .extract dist_parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish NN - Quest Converter v1.0.0'
          git push
