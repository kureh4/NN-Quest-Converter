name: Build Repo Listing

env:
  listPublishDirectory: Website
  pathToCi: ci
  DOTNET_ROLL_FORWARD: Major

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Release]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: vpm-listing
  cancel-in-progress: false

jobs:
  build-listing:
    name: build-listing
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout Automation Repository
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.pathToCi }}
          clean: false

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Refresh Listing Website Template
        run: |
          curl -fsSL https://raw.githubusercontent.com/vrchat-community/template-package/main/Website/index.html -o Website/index.html
          curl -fsSL https://raw.githubusercontent.com/vrchat-community/template-package/main/Website/app.js -o Website/app.js
          curl -fsSL https://raw.githubusercontent.com/vrchat-community/template-package/main/Website/styles.css -o Website/styles.css

      - name: Build Package Version Listing
        run: ${{ env.pathToCi }}/build.cmd BuildRepoListing --root ${{ env.pathToCi }} --list-publish-directory $GITHUB_WORKSPACE/${{ env.listPublishDirectory }} --current-package-name com.nekoneko.nn-quest-converter --current-listing-url https://raw.githubusercontent.com/kureh4/NN-Quest-Converter/main/Website/index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit VPM Listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/Website.generated
          cp -a Website /tmp/Website.generated

          git fetch origin main
          git reset --hard origin/main

          rm -rf Website
          cp -a /tmp/Website.generated Website

          git add Website
          if git diff --cached --quiet; then
            echo "No listing changes."
            exit 0
          fi

          git commit -m "chore: update VPM listing [skip ci]"
          git push
